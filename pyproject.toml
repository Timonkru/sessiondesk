[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sessiondesk"
version = "0.1.0"
description = "Local-first market desk: markets, single stocks, valuation, news and high-impact event alerts, forced-flow calendar, research reader - free data by default, paid feeds and AI as bring-your-own-key connectors."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Timon Krueger" }]
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "feedparser>=6.0",
  "beautifulsoup4>=4.12",
  "yfinance>=0.2.50",
  "holidays>=0.50",
  "anthropic>=0.60",
  "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sessiondesk = "sessiondesk.__main__:main"

[project.gui-scripts]
sessiondeskw = "sessiondesk.__main__:main"      # Windows: starts without a console window (autostart)

[tool.setuptools.packages.find]
include = ["sessiondesk*"]

[tool.setuptools.package-data]
sessiondesk = ["static/**/*", "data/universes/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
