<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="sd-token" content="{{TOKEN}}">
<meta name="sd-version" content="{{VERSION}}">
<title>SessionDesk</title>
<link rel="icon" href="/static/sessiondesk.ico">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<link rel="stylesheet" href="/static/app.css?v={{VERSION}}">
</head>
<body>
<div id="app">
  <nav id="nav" aria-label="Main">
    <a class="brand" href="#/">SessionDesk</a>
    <div class="navsec">Start</div>
    <a href="#/" data-route="today">Today</a>
    <a href="#/calendar" data-route="calendar">Calendar</a>
    <a href="#/flows" data-route="flows">Forced flows</a>
    <div class="navsec">Markets</div>
    <a href="#/markets" data-route="overview">Overview</a>
    <a href="#/indices" data-route="indices">Indices</a>
    <a href="#/sectors" data-route="sectors">Sectors</a>
    <a href="#/stocks" data-route="stocks">Stocks</a>
    <a href="#/watch" data-route="watch">Movers</a>
    <a href="#/baskets" data-route="baskets">Baskets</a>
    <div class="navsec">Data</div>
    <a href="#/hub" data-route="hub">Data hub</a>
    <a href="#/macro" data-route="macro">Macro</a>
    <a href="#/commodities" data-route="commodities">Commodities &amp; energy</a>
    <a href="#/tankers" data-route="tankers">Tankers (AIS)</a>
    <div class="navsec">News</div>
    <a href="#/news" data-route="news">News</a>
    <a href="#/research" data-route="research">Research</a>
    <div class="navsec">My trading</div>
    <a href="#/broker" data-route="broker">Accounts &amp; EAs</a>
    <a href="#/journal" data-route="journal">Journal</a>
    <a href="#/levels" data-route="levels">Levels &amp; alerts</a>
    <span id="extSlot" hidden></span>
    <span class="spacer"></span>
    <a href="#/jobs" data-route="jobs">Jobs</a>
    <a href="#/system" data-route="system">System</a>
    <a href="#/settings" data-route="settings">Settings</a>
    <a href="#/help" data-route="help">Help</a>
    <div class="navfoot"><span id="conn">connecting…</span> · <a id="sysState" href="#/system" title="System problems"></a><button id="theme" class="linkish" type="button">theme</button></div>
  </nav>
  <div id="main">
    <header id="top">
      <button id="menu" class="linkish" type="button" aria-label="Menu">Menu</button>
      <button id="back" class="iconbtn" type="button" title="Back (Alt+Left)" aria-label="Back" disabled>←</button>
      <div id="cmd">
        <input id="cmdInput" type="text" autocomplete="off" spellcheck="false"
               placeholder="Search a stock or page, type a command (AAPL OPT, DAX MEMBERS, ECO) or ask the AI   ( / )">
        <div id="cmdList" hidden></div>
      </div>
      <div id="worldClock" aria-label="World clock"></div>
      <div id="eventStrip" title="Next high-impact release"></div>
      <button id="newTab" class="linkish" type="button" title="Keep this page and open a copy as a new tab (or Ctrl+click a menu entry)">+ Tab</button>
      <button id="newWin" class="linkish" type="button" title="Open this page in a new window (e.g. for a second screen)">⧉ Window</button>
      <button id="aiToggle" type="button">Ask AI</button>
    </header>
    <div id="releaseBar" hidden></div>
    <div id="tabbar" aria-label="Open pages"></div>
    <main id="view"></main>
  </div>
  <aside id="ai" hidden aria-label="AI assistant">
    <div class="ai-head">
      <strong>AI assistant</strong>
      <span id="aiCtx" class="muted"></span>
      <button id="aiClear" class="linkish" type="button">clear</button>
      <button id="aiClose" class="linkish" type="button">close</button>
    </div>
    <div id="aiLog"></div>
    <form id="aiForm">
      <textarea id="aiInput" rows="3" placeholder="Ask about what you see on this page…"></textarea>
      <div class="ai-foot"><span id="aiMeta" class="muted"></span><button type="submit">Send</button></div>
    </form>
  </aside>
</div>
<div id="toasts" aria-live="polite"></div>
<script type="module" src="/static/app.js?v={{VERSION}}"></script>
</body>
</html>
